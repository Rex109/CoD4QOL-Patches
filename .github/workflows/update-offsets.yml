name: Update offsets

on:
  schedule:
    - cron: "17 */6 * * *"          # every 6 hours
  workflow_dispatch:
    inputs:
      rescan:
        description: "Re-check every cached offset against the current patterns (writes nothing)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - signatures.json
      - patches.json
      - scan.py

permissions:
  contents: write                   # commit offsets.json
  actions: write                    # keep-alive: re-enable this workflow

concurrency:
  group: update-offsets
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore downloaded DLLs
        uses: actions/cache@v4
        with:
          path: dlls
          key: cod4x-dlls-${{ github.run_id }}
          restore-keys: cod4x-dlls-

      - name: Scan
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ inputs.rescan }}" = "true" ]; then
            python3 scan.py --rescan
          else
            python3 scan.py
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit offsets.json
        if: inputs.rescan != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offsets.json
          if git diff --cached --quiet; then
            echo "offsets.json unchanged"
          else
            git commit -m "Update offsets"
            git pull --rebase
            git push
          fi

      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-offsets.yml/enable" || true
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git pull --rebase
            git push
          fi

      - name: Fail if something needs attention
        if: steps.scan.outputs.code != '0'
        run: |
          echo "::error::Some offsets could not be resolved, see the Scan step log"
          exit 1
